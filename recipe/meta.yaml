{% set python_min = '3.11' %}
{% set name = "cifkit" %}
{%- set version = "1.2.1" -%}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: eda0c22438e2ec3ff6a8c41f753d74a63764e5f10ecdd73b1c289f1db828d6df

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - setuptools-git-versioning >=2.0
    - pip

  run:
    - python >={{ python_min }}
    - gemmi
    - matplotlib-base
    - numpy
    - openpyxl
    - pandas
    - pyvista
    - scipy

test:
  imports:
    - cifkit
  requires:
    - pip
    - pytest
    - python {{ python_min }}
  commands:
    - pip check
    - pip list

about:
  home: https://github.com/bobleesj/cifkit
  summary: 'Python package for .cif high-throughput analysis'
  description: |
    cifkit is an open-source Python library for preprocessing .cif files, generating supercells, and extract features.
  license: Free To Use But Restricted
  license_file: LICENSE.rst
  doc_url: https://bobleesj.github.io/cifkit/

extra:
  recipe-maintainers:
    - bobleesj
